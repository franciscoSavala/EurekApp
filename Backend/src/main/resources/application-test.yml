spring:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        # El application.yml fija MySQLDialect en spring.jpa.properties, que le gana a
        # database-platform: sin este override Hibernate genera DDL/SQL de MySQL contra H2.
        dialect: org.hibernate.dialect.H2Dialect
    hibernate:
      # El esquema lo crea schema.sql (src/test/resources). No se genera desde las entidades porque
      # varias declaran columnDefinition en sintaxis MySQL (p.ej. TINYINT(1)) que H2 no acepta.
      ddl-auto: none
    show-sql: true
    defer-datasource-initialization: true
  datasource:
    # DB_CLOSE_DELAY=-1: sin esto H2 destruye la base cuando se cierra la ultima conexion y el
    # esquema creado por Hibernate al arrancar desaparece antes de que corran los tests.
    url: jdbc:h2:mem:mydb;DB_CLOSE_DELAY=-1
    username: sa
    password: password
    driver-class-name: org.h2.Driver
    hikari:
      # "SET NAMES utf8mb4" del application.yml es sintaxis de MySQL: H2 la rechaza y aborta el contexto.
      # Queda vacia solo para el perfil test; en MySQL sigue haciendo falta.
      connection-init-sql: ""
  application:
    name: Backend
  servlet:
    multipart:
      max-file-size: 10MB
