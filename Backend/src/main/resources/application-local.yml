spring:
  datasource:
    url: jdbc:mysql://localhost:3306/eurekapp?useUnicode=true&characterEncoding=UTF-8
    username: eurekapp
    password: eurekapp
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

application:
  s3:
    bucket:
      name: 'eurekapp-temp'
    # S3 local vía MinIO por default (ver servicio "minio" en docker-compose.yml). Flag por variable
    # de entorno para apuntar al S3 real de AWS en local en vez de MinIO: ver ".env.local.example"
    # (sección "S3 local vs AWS real").
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
  openai:
    url: 'https://api.openai.com/v1/'
    api-key: ${OPENAI_SECRET_KEY}           # requerido: setear en .env.local
  jwt:
    sign-key: ${JWT_SIGN_KEY}               # requerido: setear en .env.local
  mail:
    host: 'smtp.gmail.com'
    user: ${MAIL_USER}                      # requerido: setear en .env.local
    password: ${MAIL_PASSWORD}              # requerido: setear en .env.local
    port: '587'
  weaviate:
    url: 'localhost:8081'
    schema: 'http'

search:
  max-radius: 50000
